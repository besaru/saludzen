<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{% if page.description %}{{ page.description }}{% elsif page.subtitle %}{{ page.subtitle | strip_html }}{% else %}{{ site.description }}{% endif %}">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">

<!-- Place favicon.ico and apple-touch-icon.png in the root directory -->

<!-- CSS -->
<link rel="stylesheet" href="{{ '/css/owl.carousel.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/css/bootstrap.min.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/css/font-awesome.min.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/css/airspace.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/css/ionicons.min.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/css/animate.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/css/responsive.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/css/syntax.css' | relative_url }}">
<!--Team-->

<link rel="stylesheet" href="{{ '/css/team/rotating-card.css' | relative_url }}">

{% if page.calendar %}
<!--Agenda-->
<link rel="stylesheet" href="{{ '/css/fullcalendar.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/css/fullcalendar2.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/css/fullcalendar.print.css' | relative_url }}" media="print">
{% endif %}

<!--IndexCarousel-->
<link rel="stylesheet" href="{{ '/css/index-carousel.css' | relative_url }}">
<!--RSS-->
<link href="{{ site.url}}/feed.xml" rel='alternate' type="application/rss+xml">
<!-- Js -->
<script src="//ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
<script>window.jQuery || document.write('<script src="{{ site.url}}{{ site.baseurl }}/js/vendor/jquery-1.10.2.min.js"><\/script>')</script>
<script src="{{ site.url}}{{ site.baseurl }}/js/bootstrap.min.js"></script>
<script src="{{ site.url}}{{ site.baseurl }}/js/owl.carousel.min.js"></script>
<script src="{{ site.url}}{{ site.baseurl }}/js/plugins.js"></script>
<script src="{{ site.url}}{{ site.baseurl }}/js/min/waypoints.min.js"></script>
<script src="{{ site.url}}{{ site.baseurl }}/js/jquery.counterup.js"></script>


{% if page.calendar %}
<!--Agenda-->
<script src="{{ site.url}}{{ site.baseurl }}/js/calendar/jquery-ui.custom.min.js"></script>

<!--<script src="{{ site.url}}{{ site.baseurl }}/js/calendar/eventscalendar.js"></script>-->

<script src="{{ site.url}}{{ site.baseurl }}/js/calendar/lib/moment.min.js"></script>
<script src="{{ site.url}}{{ site.baseurl }}/js/calendar/fullcalendar.js"></script>
<script src="{{ site.url}}{{ site.baseurl }}/js/calendar/fullcalendar2.js"></script>
<script src="{{ site.url}}{{ site.baseurl }}/js/calendar/locale-all.js"></script>

{% endif %}
<link rel="shortcut icon" type="image/x-icon" href="{{ site.url }}{{ site.baseurl }}/favicon.ico" />

<script src="{{ site.url}}{{ site.baseurl }}/js/main.js"></script>
